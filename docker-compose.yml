services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: tribal_knowledge
      POSTGRES_USER: tk
      POSTGRES_PASSWORD: tk_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata:
